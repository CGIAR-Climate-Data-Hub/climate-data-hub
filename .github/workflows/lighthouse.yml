name: Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:example
      - uses: treosh/lighthouse-ci-action@v12
        id: lighthouse
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - name: Summarize Lighthouse scores
        if: ${{ always() && steps.lighthouse.outputs.resultsPath != '' }}
        uses: actions/github-script@v8
        env:
          LIGHTHOUSE_RESULTS_PATH: ${{ steps.lighthouse.outputs.resultsPath }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const manifestPath = path.join(
              process.env.LIGHTHOUSE_RESULTS_PATH,
              "manifest.json",
            );
            const runs = JSON.parse(fs.readFileSync(manifestPath, "utf8"))
              .filter((run) => run.isRepresentativeRun);
            const score = (value) =>
              value == null ? "—" : String(Math.round(value * 100));

            await core.summary
              .addHeading("Lighthouse scores")
              .addTable([
                [
                  { data: "Page", header: true },
                  { data: "Performance", header: true },
                  { data: "Accessibility", header: true },
                  { data: "Best practices", header: true },
                  { data: "SEO", header: true },
                ],
                ...runs.map((run) => [
                  new URL(run.url).pathname,
                  score(run.summary.performance),
                  score(run.summary.accessibility),
                  score(run.summary["best-practices"]),
                  score(run.summary.seo),
                ]),
              ])
              .addRaw("Full HTML reports are available in the workflow artifacts.")
              .write();
